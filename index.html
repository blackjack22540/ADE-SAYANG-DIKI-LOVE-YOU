<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🔥TOTO80🔥</title>

href="https://res.cloudinary.com/dhxmawzb2/image/upload/v1788122720/logo_icon_ylknir.png"

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =====================================================
   BODY
===================================================== */

body {

    font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    background: #080808;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: flex-start;

    padding: 40px 20px;

    color: #fff;

}


/* =====================================================
   CONTAINER UTAMA
===================================================== */

.container {

    position: relative;

    z-index: 10;

    background-image:
        url('https://res.cloudinary.com/dhxmawzb2/image/upload/v1788358827/1dd21110f5b64c3e2960cf7309a32ccb_u1qmxh.jpg');

    background-size: cover;

    background-position: center;

    backdrop-filter:
        saturate(180%)
        blur(12px);

    border-radius: 16px;

    width: 100%;

    max-width: 1600px;

    min-height: 1000px;

    padding: 25px;

    box-shadow:

        0 8px 32px
        rgba(0,0,0,.4),

        inset 0 0 100px
        rgba(255,255,255,.05);

}


/* =====================================================
   TEXTAREA
===================================================== */

textarea {

    width: 100%;

    height: 220px;

    font-family:
        'Courier New',
        Courier,
        monospace;

    padding: 12px 15px;

    margin-bottom: 15px;

    font-size: 30px;

    border-radius: 12px;

    border:
        1px solid
        rgba(255,255,255,.3);

    outline: none;

    resize: vertical;

    background:
        rgba(0,0,0,.15);

    box-shadow:
        inset 0 0 8px
        rgba(255,255,255,.2);

    color: #fff;

}


/* =====================================================
   JUDUL
===================================================== */

h2 {

    font-weight: 800;

    font-size: 2rem;

    text-align: center;

    margin-bottom: 25px;

    letter-spacing: .06em;

    text-shadow:
        0 2px 10px
        rgba(0,0,0,.7);

}


/* =====================================================
   TOMBOL PROSES
===================================================== */

.btn-proses-container {

    text-align: center;

    margin-bottom: 25px;

}


.btn-proses-container button {

    position: relative;

    overflow: hidden;

    width: 220px;

    padding: 16px 25px;

    border: none;

    border-radius: 16px;

    cursor: pointer;

    font-size: 22px;

    font-weight: bold;

    color: #fff;

    background:

        linear-gradient(
            135deg,
            #8B0000,
            #ff0000,
            #ff8800,
            #ff0000,
            #8B0000
        );

    background-size: 300% 300%;

    animation:
        gradientMove 6s linear infinite,
        glowPulse 2s ease infinite;

    transition: .35s;

    box-shadow:

        0 0 15px
        rgba(255,0,0,.5),

        0 0 35px
        rgba(255,120,0,.4);

}


.btn-proses-container button:hover {

    transform:
        translateY(-5px)
        scale(1.05);

    box-shadow:

        0 0 20px red,

        0 0 45px orange,

        0 0 70px gold;

}


.btn-proses-container button::before {

    content: "";

    position: absolute;

    top: 0;

    left: -150%;

    width: 70%;

    height: 100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.85),
            transparent
        );

    transform:
        skewX(-25deg);

    animation:
        shine 2.5s infinite;

}


/* =====================================================
   TOMBOL COPY
===================================================== */

.btn-group {

    display: flex;

    gap: 15px;

    margin-top: 20px;

    margin-bottom: 25px;

    flex-wrap: wrap;

    justify-content: center;

}


.btn-group button {

    position: relative;

    overflow: hidden;

    flex: 1;

    padding: 16px;

    border: none;

    outline: none;

    border-radius: 14px;

    cursor: pointer;

    font-size: 18px;

    font-weight: bold;

    letter-spacing: .3px;

    color: white;

    background:

        linear-gradient(
            135deg,
            #9d0000,
            #ff2020,
            #ff6a00,
            #ff2020,
            #9d0000
        );

    background-size: 300% 300%;

    animation:
        gradientMove 6s ease infinite;

    transition: .35s;

    box-shadow:

        0 8px 20px
        rgba(255,40,40,.35),

        0 0 15px
        rgba(255,120,0,.25);

}


.btn-group button:hover {

    transform:
        translateY(-4px)
        scale(1.04);

    box-shadow:

        0 0 15px red,

        0 0 30px orange,

        0 0 45px gold;

}


.btn-group button:active {

    transform:
        scale(.95);

}


.btn-group button::before {

    content: "";

    position: absolute;

    top: 0;

    left: -140%;

    width: 70%;

    height: 100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.8),
            transparent
        );

    transform:
        skewX(-25deg);

    animation:
        shine 2.8s infinite;

}


.btn-group button::after {

    content: "";

    position: absolute;

    left: 50%;

    bottom: -20px;

    transform:
        translateX(-50%);

    width: 80%;

    height: 30px;

    background:

        radial-gradient(
            circle,
            rgba(255,150,0,.8),
            transparent
        );

    filter:
        blur(15px);

    opacity: .7;

    animation:
        fireGlow .8s
        infinite alternate;

}


/* =====================================================
   ANIMASI TOMBOL
===================================================== */

@keyframes gradientMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}


@keyframes shine {

    0% {
        left: -140%;
    }

    100% {
        left: 180%;
    }

}


@keyframes fireGlow {

    from {

        opacity: .3;

        transform:
            translateX(-50%)
            scale(.8);

    }

    to {

        opacity: 1;

        transform:
            translateX(-50%)
            scale(1.2);

    }

}


@keyframes glowPulse {

    0%,100% {
        filter: brightness(1);
    }

    50% {
        filter: brightness(1.2);
    }

}


/* =====================================================
   RIPPLE
===================================================== */

.ripple {

    position: absolute;

    width: 10px;

    height: 10px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.7);

    transform:
        translate(-50%,-50%);

    pointer-events: none;

    animation:
        ripple .6s linear;

}


@keyframes ripple {

    0% {

        width: 0;

        height: 0;

        opacity: 1;

    }

    100% {

        width: 260px;

        height: 260px;

        opacity: 0;

    }

}


/* =====================================================
   TABLE
===================================================== */

table {

    width: 100%;

    border-collapse: collapse;

    background:
        rgba(0,0,0,.7);

    border-radius: 12px;

    overflow: hidden;

    box-shadow:
        0 6px 20px

}


thead tr {

    background-color:
        #b91c1c;

    text-shadow:
        0 1px 3px

}


th,
td {

    border-bottom:
        1px solid

    text-align: left;

    vertical-align: middle;

}


tr:last-child td {

    border-bottom: none;

}


.bank-linkaja {

}


.bank-gopay {

}


/* =====================================================
   NOTIFICATION
===================================================== */

#copyNotification {

}


/* =====================================================
   NAGA
===================================================== */

}


.side-banner img {

}


.left-banner {

    left: -90px;

}


.right-banner {

}


.right-banner img {

}


@keyframes nagaFloat {

    }

}


/* =====================================================
   RESPONSIVE NAGA
===================================================== */

@media (max-width: 1300px) {

}

}


/* =====================================================
   RESPONSIVE BUTTON
===================================================== */

@media (max-width: 600px) {

    .btn-group {

    .btn-group button {

    .btn-proses-container button {

}

/* =====================================================
   ⚡ LIGHTNING CONTAINER
===================================================== */

.lightning-container {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    overflow: hidden;
}


/* =====================================================
   ⚡ PETIR UTAMA
===================================================== */

.lightning-bolt {

    position: absolute;

    top: -8%;

    width: 150px;

    height: 115%;

    opacity: 0;

    pointer-events: none;

    background:

        linear-gradient(
            90deg,

            transparent 0%,

            transparent 35%,

            rgba(255,255,255,.2) 42%,

            #ffffff 47%,

            #ffffff 51%,

            #00eaff 56%,

            rgba(0,150,255,.8) 60%,

            transparent 67%,

        );


    clip-path:

        polygon(

            48% 0%,

            63% 0%,

            55% 10%,

            75% 10%,

            47% 25%,

            67% 25%,

            41% 40%,

            61% 40%,

            34% 57%,

            53% 57%,

            19% 75%,

            38% 75%,

            5% 100%,

            25% 80%,

            14% 80%,

            42% 60%,

            28% 60%,

            55% 43%,

            40% 43%,

            64% 27%,

            48% 27%,

            69% 12%,

            51% 12%

        );


    filter:

        drop-shadow(
            0 0 3px #ffffff
        )

        drop-shadow(
            0 0 8px #ffffff
        )

        drop-shadow(
            0 0 18px #00eaff
        )

        )

        );

}


/* =====================================================
   ⚡ CABANG PETIR
===================================================== */

.lightning-branch {

    width: 110px;

    pointer-events: none;

    background:

            90deg,

            rgba(0,130,255,.7) 60%,

        );


    clip-path:

        polygon(

            46% 0%,

            62% 0%,

            54% 15%,

            78% 15%,

            48% 32%,

            68% 32%,

            39% 51%,

            57% 51%,

            15% 100%,

            32% 57%,

            21% 57%,

            47% 36%,

            33% 36%,

            59% 18%,

            45% 18%

        );


    filter:

        drop-shadow(
            0 0 4px #ffffff
        )

        drop-shadow(
            0 0 10px #00eaff
        )

        drop-shadow(
            0 0 22px #008cff
        )

        );

}


/* =====================================================
   💥 FLASH LAYAR SAAT PETIR
===================================================== */

.lightning-screen-flash {
    position: fixed;
    inset: 0;
    z-index: 21;

}


/* =====================================================
   💙 NAGA TERKENA LISTRIK
===================================================== */

.side-banner.electric-dragon img {

    filter:

        drop-shadow(
            0 0 8px #ffffff
        )

        drop-shadow(
            0 0 18px #00eaff
        )

        )

        drop-shadow(

        )

}


/* =====================================================

===================================================== */

.side-banner.electric-dragon {

}


/* =====================================================

===================================================== */

@keyframes epicLightning {

    }

    }

}


/* =====================================================

===================================================== */

@keyframes branchLightning {

/* =====================================================

===================================================== */

@keyframes lightningScreenFlash {

    }


    6% {

        opacity: .8;

    }

    }

/* =====================================================

===================================================== */

@keyframes nagaElectric {

<body>
<!-- ⚡ CONTAINER PETIR -->
<div class="lightning-container" id="lightningContainer">
    <div class="lightning-screen-flash" id="lightningFlash"></div>
</div>

<!-- 🐉 NAGA KIRI -->
<div class="side-banner left-banner">
    <img
        src="https://assetevos.io/images/2025/11/03/naga-bonar.webp"
        alt="Naga Bonar"
    >
</div>

<!-- 🐉 NAGA KANAN -->
<div class="side-banner right-banner">
    <img
        src="https://assetevos.io/images/2025/11/03/naga-bonar.webp"
        alt="Naga Bonar"
    >
</div>

<!-- 📦 CONTAINER UTAMA -->
<div class="container">

    <h2></h2>

    <!-- INPUT DATA -->
    <textarea
        id="inputData"
        placeholder="TEMPEL DISINI BOSS!!!..."
    ></textarea>

    <!-- TOMBOL PROSES -->
    <div class="btn-proses-container">
        <button onclick="processData()">Proses</button>
    </div>

    <!-- TOMBOL COPY -->
    <div class="btn-group">

        <button onclick="copyNamaUser()">
            Nama Rekening & User
        </button>

        <button onclick="copyAmount()">
            Nominal
        </button>

        <button onclick="copyAmountAdd()">
            Nominal + 1,000
        </button>

        <button onclick="copyAmountAdd2500()">
            Nominal + 2,500
        </button>

        <button onclick="copyAmountAdd6500()">
            Nominal + 6,500
        </button>

    </div>

    <!-- 📊 TABEL HASIL -->
    <table id="outputTable" style="display:none;">

        <thead>
            <tr>
                <th>Nama Rekening</th>
                <th>User</th>
                <th>Amount</th>
            </tr>
        </thead>

        <tbody></tbody>

    </table>

</div>

<!-- 🔔 NOTIFIKASI COPY -->
<div id="copyNotification">
    Gas tempal, Sudah berhasil di copy ya !
</div>
<script>

/* =========================================================
   📊 DATA PROCESSING
========================================================= */

const bankAdd2500_6500 = [
    'bsi',
    'seabank',
    'bankjago',
    'danamon',
    'mandiri',
    'permata',
    'cimb',
    'bni',
    'bank neo',
    'ocbc',
    'maybank',
    'superbank',
    'allobank',
    'panin',
    'blubca'
];

let storedData = [];


/* =========================================================
   🔥 PROSES DATA
========================================================= */

function processData() {

    const input = document.getElementById("inputData").value.trim();
    const table = document.getElementById("outputTable");
    const tbody = table.querySelector("tbody");

    tbody.innerHTML = "";
    storedData = [];

    if (!input) {
        alert("Silahkan tempel data terlebih dahulu bossku!");
        return;
    }

    const lines = input.split(/\r?\n/);

    for (let i = 0; i < lines.length; i++) {

        /*
         * ==========================================
         * USER ADA DI BARIS INI
         * ==========================================
         */
        const userLine = lines[i].trim();

        if (!userLine) continue;

        if (userLine.startsWith("G")) continue;


        /*
         * ==========================================
         * WITHDRAW ADA DI BARIS BERIKUTNYA
         * ==========================================
         */
        const withdrawLine =
            lines[i + 1]
                ? lines[i + 1].trim()
                : "";

        if (!withdrawLine.toLowerCase().includes("withdraw")) {
            continue;
        }


        /*
         * ==========================================
         * AMBIL NOMINAL
         * ==========================================
         */
        const withdrawMatch = withdrawLine.match(
            /Withdraw\s+\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s+([\d,]+)/i
        );

        if (!withdrawMatch) {
            continue;
        }

        const amount = parseInt(
            withdrawMatch[1].replace(/,/g, ""),
            10
        );

        if (isNaN(amount)) {
            continue;
        }


        /*
         * ==========================================
         * CARI BANK + NAMA REKENING
         *
         * MULAI DARI 2 BARIS SETELAH USER
         * ==========================================
         */
        let bank = "";
        let namaRekening = "";

        for (
            let j = i + 2;
            j < i + 6 && j < lines.length;
            j++
        ) {

            const line = lines[j].trim();

            if (
                line.includes(",") &&
                line.split(",").length >= 3
            ) {

                const parts = line
                    .split(",")
                    .map(item => item.trim());

                /*
                 * BANK
                 */
                bank = parts[0].toLowerCase();

                /*
                 * NAMA REKENING
                 */
                namaRekening = parts[2];

                break;
            }
        }


        /*
         * ==========================================
         * DATA REKENING TIDAK DITEMUKAN
         * ==========================================
         */
        if (!namaRekening) {
            continue;
        }


        /*
         * ==========================================
         * NOMINAL +1.000
         * ==========================================
         */
        let amountAdd = amount;

        if (
            bank.includes("linkaja") ||
            bank.includes("gopay")
        ) {
            amountAdd = amount + 1000;
        }


        /*
         * ==========================================
         * NOMINAL +2.500
         * NOMINAL +6.500
         * ==========================================
         */
        let amountAdd2500 = amount;
        let amountAdd6500 = amount;

        if (bankAdd2500_6500.includes(bank)) {

            amountAdd2500 = amount + 2500;
            amountAdd6500 = amount + 6500;
        }


        /*
         * ==========================================
         * CLASS WARNA BANK
         * ==========================================
         */
        let bankClass = "";

        if (bank.includes("linkaja")) {

            bankClass = "bank-linkaja";

        } else if (bank.includes("gopay")) {

            bankClass = "bank-gopay";
        }


        /*
         * ==========================================
         * SIMPAN DATA
         * ==========================================
         */
        storedData.push({

            namaRekening: namaRekening,

            /*
             * ⭐ INI USER YANG BENAR
             * USER DIAMBIL DARI BARIS SEBELUM WITHDRAW
             */
            user: userLine,

            amount: amount,

            amountAdd: amountAdd,

            amountAdd2500: amountAdd2500,

            amountAdd6500: amountAdd6500,

            bankClass: bankClass
        });


        /*
         * ==========================================
         * BUAT BARIS TABEL
         * ==========================================
         */
        const row = document.createElement("tr");

        row.innerHTML = `
            <td class="${bankClass}">
                ${escapeHTML(namaRekening)}
            </td>

            <td>
                ${escapeHTML(userLine)}
            </td>

            <td>
                ${formatNumber(amount)}
            </td>
        `;

        tbody.appendChild(row);
    }


    /*
     * ==========================================
     * TAMPILKAN TABEL
     * ==========================================
     */
    if (storedData.length > 0) {

        table.style.display = "table";

    } else {

        table.style.display = "none";

        alert("Data yang sesuai tidak ditemukan bossku!");
    }
}


/* =========================================================
   🔢 FORMAT ANGKA
========================================================= */

function formatNumber(number) {

    return Number(number).toLocaleString("en-US");
}


/* =========================================================
   🛡️ AMANKAN TEKS TABEL
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   📋 COPY NAMA REKENING + USER
========================================================= */

function copyNamaUser() {

    if (storedData.length === 0) {
        alert("Proses data terlebih dahulu bossku!");
        return;
    }

    const text = storedData
        .map(data =>
            `${data.namaRekening}\t${data.user}`
        )
        .join("\n");

    copyText(text);
}

/* =========================================================
   📋 SISTEM COPY
========================================================= */

function copyText(text) {

    navigator.clipboard.writeText(text)
        .then(() => {

            showCopyNotification();

        })
        .catch(() => {

            /*
             * Fallback jika clipboard browser tidak tersedia
             */
            const textarea = document.createElement("textarea");

            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";

            document.body.appendChild(textarea);

            textarea.select();
            document.execCommand("copy");

            textarea.remove();

            showCopyNotification();
        });
}


/* =========================================================
   🔔 NOTIFIKASI COPY
========================================================= */

function showCopyNotification() {

    const notification =
        document.getElementById("copyNotification");

    notification.classList.add("show");

    setTimeout(() => {

        notification.classList.remove("show");

    }, 2000);
}


/* =========================================================
   ⚡ PETIR — ELEMENT
========================================================= */

const lightningContainer =
    document.getElementById("lightningContainer");

const lightningFlash =
    document.getElementById("lightningFlash");

const dragons =
    document.querySelectorAll(".side-banner");


/* =========================================================
   ⚡ PETIR UTAMA
========================================================= */

function createMainLightning(side) {

    const bolt =
        document.createElement("div");

    bolt.className = "lightning-bolt";

    /*
     * Petir kiri
     */
    if (side === "left") {

        bolt.style.left =
            (4 + Math.random() * 15) + "%";

    }

    /*
     * Petir kanan
     */
    else {

        bolt.style.right =
            (4 + Math.random() * 15) + "%";
    }

    /*
     * Sedikit variasi ukuran
     */
    const scale =
        0.75 + Math.random() * 0.6;

    bolt.style.transform =
        `scale(${scale})`;

    lightningContainer.appendChild(bolt);

    setTimeout(() => {

        bolt.remove();

    }, 750);
}


/* =========================================================
   ⚡ CABANG PETIR
========================================================= */

function createBranches(side) {

    const branchCount =
        3 + Math.floor(Math.random() * 3);

    for (let i = 0; i < branchCount; i++) {

        setTimeout(() => {

            const branch =
                document.createElement("div");

            branch.className =
                "lightning-branch";


            if (side === "left") {

                branch.style.left =
                    (3 + Math.random() * 22) + "%";

            } else {

                branch.style.right =
                    (3 + Math.random() * 22) + "%";
            }


            branch.style.top =
                (Math.random() * 55) + "%";


            const rotation =
                -10 + Math.random() * 20;

            const scale =
                0.65 + Math.random() * 0.8;


            branch.style.transform =
                `rotate(${rotation}deg) scale(${scale})`;


            lightningContainer.appendChild(branch);


            setTimeout(() => {

                branch.remove();

            }, 700);

        }, i * 55);
    }
}


/* =========================================================
   🐉 NAGA MENJADI LISTRIK
========================================================= */

function activateDragonElectric() {

    dragons.forEach(dragon => {

        dragon.classList.remove("electric-dragon");

        /*
         * Paksa browser membaca ulang animasi
         */
        void dragon.offsetWidth;

        dragon.classList.add("electric-dragon");

        setTimeout(() => {

            dragon.classList.remove("electric-dragon");

        }, 800);
    });
}


/* =========================================================
   💥 FLASH PETIR
========================================================= */

function createLightningFlash() {

    lightningFlash.classList.remove(
        "active"
    );

    /*
     * Reset animasi
     */
    void lightningFlash.offsetWidth;

    lightningFlash.classList.add(
        "active"
    );
}


/* =========================================================
   ⚡ STRIKE UTAMA
========================================================= */

function lightningStrike() {

    /*
     * Pilih sisi secara random
     */
    const side =
        Math.random() < 0.5
            ? "left"
            : "right";


    /* Petir utama */
    createMainLightning(side);


    /* Cabang petir */
    createBranches(side);


    /* Flash layar */
    createLightningFlash();


    /* Naga menyala */
    activateDragonElectric();


    /*
     * 75% kemungkinan petir menyambar
     * sisi berlawanan juga
     */
    if (Math.random() < 0.75) {

        const opposite =
            side === "left"
                ? "right"
                : "left";

        setTimeout(() => {

            createMainLightning(opposite);
            createBranches(opposite);

        }, 150);
    }


    /*
     * Jadwalkan petir berikutnya
     */
    const nextStrike =
        2500 + Math.random() * 3500;

    setTimeout(
        lightningStrike,
        nextStrike
    );
}


/* =========================================================
   ⚡ MULAI ANIMASI PETIR
========================================================= */

setTimeout(() => {

    lightningStrike();

}, 1200);

    .addEventListener("keydown", function(event) {

        /*

         * untuk proses data
         */
        if (
            event.key === "Enter" &&
            event.ctrlKey
        ) {

            event.preventDefault();

            processData();
        }
    });

</script>
